# ==============================================
# AURA — Docker Compose (Development)
# ==============================================
# Start all services: docker compose up --build
# ==============================================

services:
  # --- PostgreSQL Database ---
  postgres:
    image: postgres:16-alpine
    container_name: aura-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_db_password}
      POSTGRES_DB: ${POSTGRES_DB:-aura_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aura} -d ${POSTGRES_DB:-aura_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - aura-network

  # --- MQTT Broker (Mosquitto) ---
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: aura-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./infrastructure/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./infrastructure/mosquitto/password.txt:/mosquitto/config/password.txt
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - aura-network

  # --- FastAPI Backend ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aura-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-aura}:${POSTGRES_PASSWORD:-changeme_db_password}@postgres:5432/${POSTGRES_DB:-aura_db}
      - POSTGRES_HOST=postgres
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - MQTT_USERNAME=${MQTT_USERNAME:-aura_mqtt}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-changeme_mqtt_password}
      - JWT_SECRET=${JWT_SECRET:-changeme_jwt_secret_min_32_chars_long}
      - CORS_ORIGINS=http://localhost:3000,http://frontend:3000
      - APP_ENV=${APP_ENV:-development}
      - DEBUG=${DEBUG:-true}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:8000/health'); r.raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - aura-network

  # --- Next.js Frontend ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aura-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
      - NEXT_PUBLIC_MQTT_WS_URL=ws://localhost:9001
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend/src:/app/src
    restart: unless-stopped
    networks:
      - aura-network

  # --- Robot Simulator ---
  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    container_name: aura-simulator
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - MQTT_USERNAME=${MQTT_USERNAME:-aura_mqtt}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-changeme_mqtt_password}
      - SIMULATOR_ROBOT_ID=${SIMULATOR_ROBOT_ID:-AURA-001}
      - SIMULATOR_MODE=${SIMULATOR_MODE:-NORMAL}
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - aura-network

volumes:
  postgres_data:
    driver: local
  mosquitto_data:
    driver: local
  mosquitto_log:
    driver: local

networks:
  aura-network:
    driver: bridge
