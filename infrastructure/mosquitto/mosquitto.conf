# ==============================================
# Mosquitto MQTT Broker Configuration
# ==============================================

# Listener for MQTT over TCP
listener 1883
protocol mqtt

# Listener for MQTT over WebSocket (for browser clients)
listener 9001
protocol websockets

# Authentication
allow_anonymous false
password_file /mosquitto/config/password.txt

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type all
connection_messages true
